[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-monitor"
version = "0.1.0"
description = "Mirror Claude Enterprise compliance data into Notion"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37,<1",
  "opentelemetry-proto>=1.25,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
claude-monitor = "claude_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
