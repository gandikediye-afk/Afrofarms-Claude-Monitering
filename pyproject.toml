[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-monitor"
version = "0.1.0"
description = "Mirror Claude Enterprise compliance data into Notion"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.37,<1",
  "opentelemetry-proto>=1.25,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# starlette.testclient imports httpx at module scope, so `pytest` cannot even
# collect tests/test_otlp.py without it.
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "pg8000>=1.31,<2",
]
# Serverless//no-persistent-disk deployments store state in Postgres.
postgres = [
  "pg8000>=1.31,<2",
]

[project.scripts]
claude-monitor = "claude_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
